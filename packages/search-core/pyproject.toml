[project]
name = "work-retrieval-core"
version = "0.1.0"
description = "Production retrieval engine and immutable runtime adapters."
requires-python = "==3.12.*"
dependencies = [
    "boto3==1.43.46",
    "numpy==2.5.1",
    "tantivy==0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/work_retrieval_core"]
