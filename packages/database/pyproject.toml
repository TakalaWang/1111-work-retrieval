[project]
name = "work-retrieval-database"
version = "0.1.0"
description = "SQLAlchemy domain model ownership for the work retrieval platform."
requires-python = "==3.12.*"
dependencies = ["psycopg[binary]>=3.2,<4", "sqlalchemy>=2.0,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/work_retrieval_database"]
