name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Verify committed OpenAPI
        run: >-
          uv run python -m work_retrieval_api.export_openapi
          packages/contract/openapi.json --check

  web:
    name: Web and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.28.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --dir apps/web check
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
      - name: Verify generated contracts are committed
        run: pnpm --dir packages/contract generate:check

  postgres:
    name: PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: work_retrieval
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "psql -U postgres -d work_retrieval -Atqc 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/work_retrieval
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - name: Upgrade twice and verify the job schema
        run: |
          uv run alembic -c database/alembic.ini upgrade head
          uv run alembic -c database/alembic.ini upgrade head
          test "$(psql -h localhost -U postgres -d work_retrieval -Atc \
            "SELECT string_agg(tablename, ',' ORDER BY tablename) FROM pg_tables WHERE schemaname = 'public'")" = "alembic_version,jobs"
          test "$(psql -h localhost -U postgres -d work_retrieval -Atc \
            "SELECT version_num FROM alembic_version")" = "0002_create_jobs"
          uv run alembic -c database/alembic.ini check

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.28.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir infra test
      - run: pnpm --dir infra build
      - run: pnpm --dir infra synth

  container:
    name: API container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the production image
        run: |
          docker build --platform linux/amd64 --tag work-retrieval-api:ci .
          test "$(docker image inspect work-retrieval-api:ci --format '{{.Architecture}}')" = amd64
