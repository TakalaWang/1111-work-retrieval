name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to confirm a production deployment
        required: true
        type: string
      api_image_uri:
        description: Immutable ECR image URI including its sha256 digest
        required: true
        type: string
      artifact_manifest_sha:
        description: Lowercase SHA-256 identifying runtime artifacts in S3
        required: true
        type: string
      gpu_instance_type:
        description: EC2 GPU instance type for the ECS capacity provider
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate immutable deployment inputs
        env:
          API_IMAGE_URI: ${{ inputs.api_image_uri }}
          ARTIFACT_MANIFEST_SHA: ${{ inputs.artifact_manifest_sha }}
          GPU_INSTANCE_TYPE: ${{ inputs.gpu_instance_type }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_REGION"
          [[ "$API_IMAGE_URI" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/.+@sha256:[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GPU_INSTANCE_TYPE" =~ ^[a-z0-9][a-z0-9.-]*$ ]]
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.28.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web build
      - uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Validate image ownership
        env:
          API_IMAGE_URI: ${{ inputs.api_image_uri }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$API_IMAGE_URI" == "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/"* ]]
      - name: Deploy the reviewed stack
        env:
          API_IMAGE_URI: ${{ inputs.api_image_uri }}
          ARTIFACT_MANIFEST_SHA: ${{ inputs.artifact_manifest_sha }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          GPU_INSTANCE_TYPE: ${{ inputs.gpu_instance_type }}
        run: |
          S3_PREFIX_LIST_IDS="$(aws ec2 describe-managed-prefix-lists \
            --filters \
              "Name=owner-id,Values=AWS" \
              "Name=prefix-list-name,Values=com.amazonaws.${AWS_REGION}.s3" \
            --query 'PrefixLists[].PrefixListId' \
            --output json)"
          jq -e 'length == 1' <<<"$S3_PREFIX_LIST_IDS"
          S3_PREFIX_LIST_ID="$(jq -r '.[0]' <<<"$S3_PREFIX_LIST_IDS")"
          [[ "$S3_PREFIX_LIST_ID" =~ ^pl-[0-9a-f]+$ ]]
          pnpm --dir infra exec cdk deploy WorkRetrievalData WorkRetrievalPlatform \
            --require-approval never \
            --outputs-file cdk-outputs.json \
            --parameters "WorkRetrievalData:S3PrefixListId=$S3_PREFIX_LIST_ID" \
            --parameters "WorkRetrievalPlatform:ApiImageUri=$API_IMAGE_URI" \
            --parameters "WorkRetrievalPlatform:ArtifactManifestSha256=$ARTIFACT_MANIFEST_SHA" \
            --parameters "WorkRetrievalPlatform:GpuInstanceType=$GPU_INSTANCE_TYPE"
      - name: Publish the static web app
        run: |
          WEB_BUCKET="$(jq -r '.WorkRetrievalPlatform.WebBucketName' cdk-outputs.json)"
          DISTRIBUTION_ID="$(jq -r '.WorkRetrievalPlatform.DistributionId' cdk-outputs.json)"
          [[ "$WEB_BUCKET" =~ ^[a-z0-9][a-z0-9.-]+$ ]]
          [[ "$DISTRIBUTION_ID" =~ ^[A-Z0-9]+$ ]]
          aws s3 sync apps/web/build "s3://$WEB_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
