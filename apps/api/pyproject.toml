[project]
name = "work-retrieval-api"
version = "0.1.0"
description = "HTTP contract for the 1111 job retrieval platform."
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "work-retrieval-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/work_retrieval_api"]

[tool.uv.sources]
work-retrieval-core = { workspace = true }
